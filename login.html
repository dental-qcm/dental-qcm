<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — Annales QCM</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="theme.js?v=20261103e"></script><link rel="stylesheet" href="style.css?v=20261103e">
<script src="sync.js?v=20261103e"></script>
<style>
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.box{width:100%;max-width:440px;display:flex;flex-direction:column;gap:22px}
.logo{display:flex;align-items:center;gap:12px;font-weight:900;font-size:26px;color:var(--text)}
.logo i{width:44px;height:44px;border-radius:14px;background:var(--yellow);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 var(--accent-deep)}
.card{background:var(--bg-2);border:2px solid var(--border);border-bottom-width:6px;border-radius:28px;padding:28px;display:flex;flex-direction:column;gap:18px}
h1{font-size:32px;margin:0}
.sub{font-size:16px;color:var(--text-3);font-weight:700;line-height:1.45}
label{display:block;font-size:13px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);margin-bottom:6px}
.in{width:100%;box-sizing:border-box;min-height:54px;padding:0 16px;border:2px solid var(--border);border-radius:16px;background:var(--bg);font-size:17px;font-weight:800;color:var(--text);font-family:inherit}
.in:focus{outline:none;border-color:var(--yellow)}
.pw{position:relative}.pw button{position:absolute;right:8px;top:7px;height:40px;padding:0 12px;border:none;background:none;font-weight:900;font-size:14px;color:var(--text-3);cursor:pointer;font-family:inherit}
.err{background:var(--red-bg);border:2px solid var(--red-border);color:var(--red-text);border-radius:14px;padding:10px 14px;font-weight:800;font-size:15px}
.skip{text-align:center;font-size:15px;font-weight:800;color:var(--text-3)}
.note{font-size:14px;font-weight:700;color:var(--text-3);text-align:center;line-height:1.4}
</style></head><body>
<div class="wrap"><div class="box">
  <div class="logo"><i><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--on-accent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i>Annales</div>
  <form class="card" id="f">
    <div><h1>Connexion</h1><p class="sub" style="margin-top:6px">Pour retrouver ton historique et tes erreurs sur tous tes appareils.</p></div>
    <div id="err" class="err" style="display:none"></div>
    <div><label for="u">Nom d'utilisateur</label><input class="in" id="u" autocomplete="username" autocapitalize="none" autocorrect="off" required></div>
    <div><label for="p">Mot de passe</label><div class="pw"><input class="in" id="p" type="password" autocomplete="current-password" required><button type="button" id="show">Afficher</button></div></div>
    <button class="btn-primary" id="go" type="submit" style="width:100%">Se connecter</button>
  </form>
  <div class="skip"><a href="index.html" id="skip" style="color:inherit">Continuer sans me connecter</a></div>
  <div class="note">Sans connexion, tout reste enregistré uniquement sur cet appareil.</div>
</div></div>
<script>
if (qcmSync.user()) location.replace('index.html');
document.getElementById('skip').onclick = function () { try { sessionStorage.setItem('qcm_guest', '1'); } catch (e) {} };
document.getElementById('show').onclick = function () {
  var p = document.getElementById('p'), h = p.type === 'password';
  p.type = h ? 'text' : 'password'; this.textContent = h ? 'Masquer' : 'Afficher';
};
document.getElementById('f').onsubmit = async function (e) {
  e.preventDefault();
  var err = document.getElementById('err'), go = document.getElementById('go');
  err.style.display = 'none'; go.disabled = true; go.textContent = 'Connexion…';
  try {
    await qcmSync.login(document.getElementById('u').value, document.getElementById('p').value);
    go.textContent = 'Synchronisation…';
    await qcmSync.syncNow();
    location.href = 'index.html';
  } catch (ex) {
    err.textContent = ex.message; err.style.display = 'block';
    go.disabled = false; go.textContent = 'Se connecter';
  }
};
</script>
</body></html>
