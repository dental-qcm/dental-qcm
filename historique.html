<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historique — Annales QCM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    (function() {
      const s = JSON.parse(localStorage.getItem('qcm_settings') || '{}');
      if (!s.accentColor && !s.theme) return;
      const r = document.documentElement;
      const c = s.accentColor || '#00c853';
      const t = s.theme || 'dark';
      function hexToRgba(hex, a) { const rv=parseInt(hex.slice(1,3),16),gv=parseInt(hex.slice(3,5),16),bv=parseInt(hex.slice(5,7),16); return 'rgba('+rv+','+gv+','+bv+','+a+')'; }
      r.style.setProperty('--yellow', c); r.style.setProperty('--yellow-dim', hexToRgba(c,0.08));
      r.style.setProperty('--yellow-text', c); r.style.setProperty('--accent-color', c);
      if (t === 'light') {
        r.style.setProperty('--bg','#f8f8f5'); r.style.setProperty('--bg-2','#ffffff');
        r.style.setProperty('--bg-3','#f0f0eb'); r.style.setProperty('--border','#e0e0db');
        r.style.setProperty('--text','#1a1a18'); r.style.setProperty('--text-2','#5a5a52'); r.style.setProperty('--text-3','#9a9a90');
      } else {
        r.style.setProperty('--bg','#0d0d0d'); r.style.setProperty('--bg-2','#161616');
        r.style.setProperty('--bg-3','#1e1e1e'); r.style.setProperty('--border','#2a2a2a');
        r.style.setProperty('--text','#f0f0ee'); r.style.setProperty('--text-2','#a0a09a'); r.style.setProperty('--text-3','#606060');
      }
    })();
  </script>
  <style>
    .history-card {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.25rem 1.5rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      transition: border-color 0.15s;
    }
    .history-card:hover { border-color: var(--border-2); }
    .score-circle {
      width: 56px; height: 56px;
      border-radius: 50%;
      border: 2px solid var(--yellow);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      font-size: 15px; font-weight: 500;
      color: var(--yellow);
    }
    .score-circle.low { border-color: var(--red-text, #eb8080); color: var(--red-text, #eb8080); }
    .score-circle.mid { border-color: #f0a500; color: #f0a500; }
    .card-main { flex: 1; min-width: 0; }
    .card-date { font-size: 12px; color: var(--text-3); margin-bottom: 4px; }
    .card-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
    .tag-pill { font-size:11px; padding:2px 8px; border-radius:3px; border:1px solid var(--border); color:var(--text-3); background:var(--bg-3); }
    .mode-badge { font-size: 11px; padding: 2px 9px; border-radius: 20px; font-weight: 500; }
    .mode-entrainement { background: var(--yellow-dim, rgba(0,200,83,0.1)); color: var(--yellow); border: 1px solid var(--yellow); }
    .mode-examen { background: rgba(235,128,128,0.1); color: #eb8080; border: 1px solid #eb808050; }
    .card-right { text-align: right; flex-shrink: 0; }
    .total-pts { font-size: 12px; color: var(--text-3); margin-top: 4px; }
    .btn-danger {
      background: transparent;
      border: 1px solid #eb8080;
      color: #eb8080;
      border-radius: var(--radius);
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: var(--font-body);
      transition: all 0.15s;
    }
    .btn-danger:hover { background: rgba(235,128,128,0.1); }
    .empty-state {
      text-align: center;
      padding: 4rem 0;
      color: var(--text-3);
    }
    .empty-icon { font-size: 3rem; margin-bottom: 1rem; }
    .empty-title { font-size: 16px; font-weight: 500; color: var(--text-2); margin-bottom: .5rem; }
    .empty-desc { font-size: 14px; color: var(--text-3); }
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
    }
    .stat-num { font-size: 22px; font-weight: 400; color: var(--yellow); }
    .stat-lbl { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .08em; margin-top: 2px; }
  </style>
</head>
<body>

<header class="quiz-header">
  <div class="container">
    <a href="index.html" class="back-link">← Accueil</a>
    <div class="logo">QCM<span>Annales</span></div>
    <div></div>
  </div>
</header>

<div class="container" style="padding-top:2.5rem; padding-bottom:3rem; max-width:800px;">

  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem;">
    <div>
      <h1 style="font-size:2rem; margin-bottom:0.25rem;">Historique</h1>
      <p style="color:var(--text-2); font-size:14px;">Tes sessions de révision passées.</p>
    </div>
    <button class="btn-danger" onclick="effacerHistorique()">🗑 Effacer l'historique</button>
  </div>

  <div id="content"></div>

</div>

<script>
const history = JSON.parse(localStorage.getItem('qcm_history') || '[]');

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long', year:'numeric' })
    + ' à ' + d.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' });
}

function scoreClass(sur20) {
  if (sur20 >= 12) return '';
  if (sur20 >= 8) return 'mid';
  return 'low';
}

function render() {
  const container = document.getElementById('content');

  if (!history.length) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📭</div>
        <div class="empty-title">Aucun quiz effectué pour l'instant</div>
        <div class="empty-desc">Lance une session depuis la page d'accueil pour voir ton historique ici.</div>
      </div>`;
    return;
  }

  // Stats globales
  const total = history.length;
  const moyenneRaw = history.reduce((acc, h) => acc + (h.sur20 || 0), 0) / total;
  const moyenne = Math.round(moyenneRaw * 10) / 10;
  const meilleur = Math.max(...history.map(h => h.sur20 || 0));

  container.innerHTML = `
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-num">${total}</div>
        <div class="stat-lbl">Sessions</div>
      </div>
      <div class="stat-card">
        <div class="stat-num">${moyenne}/20</div>
        <div class="stat-lbl">Moyenne</div>
      </div>
      <div class="stat-card">
        <div class="stat-num">${meilleur}/20</div>
        <div class="stat-lbl">Meilleur score</div>
      </div>
    </div>
    <div id="cards"></div>`;

  const cards = document.getElementById('cards');
  [...history].reverse().forEach(h => {
    const sur20 = h.sur20 !== undefined ? h.sur20 : (h.scoreTotal ? Math.round(h.scoreTotal * 20 / h.total * 10) / 10 : 0);
    const tags = h.tags && h.tags.length ? h.tags : ['Tous les chapitres'];
    const mode = h.mode === 'examen' ? 'examen' : 'entrainement';
    const modeLabel = mode === 'examen' ? 'Examen' : 'Entraînement';

    const card = document.createElement('div');
    card.className = 'history-card';
    card.innerHTML = `
      <div class="score-circle ${scoreClass(sur20)}">${sur20}/20</div>
      <div class="card-main">
        <div class="card-date">${formatDate(h.date)}</div>
        <div style="display:flex; align-items:center; gap:8px; margin-top:4px;">
          <span class="mode-badge mode-${mode}">${modeLabel}</span>
          <span style="font-size:12px; color:var(--text-3);">${h.total || h.details?.length || '?'} questions</span>
        </div>
        <div class="card-tags">
          ${tags.map(t => `<span class="tag-pill">${t}</span>`).join('')}
        </div>
      </div>
      <div class="card-right">
        <div style="font-size:22px; font-weight:400; color:var(--text);">${sur20}<span style="font-size:14px;color:var(--text-3);">/20</span></div>
        <div class="total-pts">${h.scoreTotal?.toFixed ? h.scoreTotal.toFixed(2) : h.scoreTotal} / ${h.total} pts</div>
      </div>`;
    cards.appendChild(card);
  });
}

function effacerHistorique() {
  if (!confirm('Effacer tout l\'historique ? Cette action est irréversible.')) return;
  localStorage.removeItem('qcm_history');
  window.location.reload();
}

render();
</script>
</body>
</html>
