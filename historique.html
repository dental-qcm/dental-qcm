<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historique — Annales QCM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <script src="theme.js?v=20261103b"></script>
  <script src="qcm-ui.js?v=20261103b"></script>
  <script src="sync.js?v=20261103b"></script>
  <link rel="stylesheet" href="style.css?v=20261103b">
  
  <style>
    .history-card {
      background: var(--bg-2);
      border: 2px solid var(--border); border-bottom-width: 5px;
      border-radius: var(--radius-lg);
      padding: 1.25rem 1.5rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .history-card:hover { border-color: var(--yellow); }
    .score-circle {
      width: 72px; height: 72px;
      border-radius: 50%;
      border: 2px solid var(--yellow);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      font-size: 14px; font-weight:900;
      color: var(--yellow-text);
    }
    .score-circle.low { border-color: var(--red); color: var(--red); }
    .score-circle.mid { border-color: var(--amber-text); color: var(--amber-text); }
    .card-main { flex: 1; min-width: 0; }
    .card-date { font-size: 12px; color: var(--text-3); margin-bottom: 4px; }
    .card-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
    .tag-pill { font-size:11px; padding:2px 8px; border-radius:3px; border:2px solid var(--border); color:var(--text-3); background:var(--bg-3); }
    .mode-badge { font-size: 11px; padding: 2px 9px; border-radius: 20px; font-weight:800; }
    .mode-entrainement { background: var(--yellow-dim); color: var(--yellow-text); border: 2px solid var(--yellow); }
    .mode-examen { background: var(--red-bg); color: var(--red-text); border: 2px solid var(--red-border); }
    .card-right { text-align: right; flex-shrink: 0; }
    .total-pts { font-size: 12px; color: var(--text-3); margin-top: 4px; }
    .btn-danger {
      background: transparent;
      border: 2px solid var(--red);
      color: var(--red);
      border-radius: var(--radius);
      padding: 8px 18px;
      font-size: 13px;
      font-weight:800;
      cursor: pointer;
      font-family: var(--font-body);
      transition: all 0.15s;
    }
    .btn-danger:hover { background: var(--red-bg); }
    .empty-state { text-align: center; padding: 4rem 0; }
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
    }
    .stat-num { font-size: 22px; font-weight:700; color: var(--yellow); }
    .stat-lbl { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .08em; margin-top: 2px; }

    /* MODALE */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--overlay);
      z-index: 1000;
      overflow-y: auto;
      padding: 3rem 2rem;
    }
    .modal-overlay.show { display: flex; align-items: flex-start; justify-content: center; }
    .modal {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      width: 90%;
      max-width: 1100px;
      padding: 2.5rem 3rem;
      position: relative;
    }
    .modal-close {
      position: absolute;
      top: 1.25rem; right: 1.25rem;
      background: var(--bg-3);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      font-size: 20px;
      color: var(--text-2);
      line-height: 1;
      z-index: 10;
    }
    .modal-close:hover { background: var(--border); color: var(--text); }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .modal-overlay.show .modal { animation: fadeUp 0.2s cubic-bezier(0.4,0,0.2,1); }

    /* CORRECTION QUESTIONS */
    .revue-q {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-bottom: 1rem;
    }
    .revue-q-tag { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .08em; margin-bottom: .5rem; }
    .revue-q-text { font-size: 14px; color: var(--text); margin-bottom: 1rem; line-height: 1.6; }
    .revue-opt {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 13px;
      border: 1px solid transparent;
    }
    .revue-opt.correct { background: var(--green-bg); border-color: var(--green); color: var(--green-text); }
    .revue-opt.wrong { background: var(--red-bg); border-color: var(--red-border); color: var(--red-text); }
    .revue-opt.neutral { background: var(--bg-3); color: var(--text-2); }
    .opt-prefix { font-weight:800; flex-shrink: 0; width: 16px; }
    .opt-exp { font-size: 12px; margin-top: 4px; color: inherit; opacity: 0.8; }
    .revue-expl {
      border-left: 3px solid var(--yellow);
      border-radius: 0 6px 6px 0;
      background: var(--bg-3);
      padding: .75rem 1rem;
      margin-top: .75rem;
      font-size: 13px;
      color: var(--text-2);
      line-height: 1.6;
    }
    .revue-pts {
      font-size: 12px;
      font-weight:800;
      margin-left: auto;
      flex-shrink: 0;
    }
    .revue-qroc-ans {
      background: var(--bg-3);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: .75rem 1rem;
      font-size: 13px;
      color: var(--text-2);
      margin-bottom: .5rem;
    }
  </style>
</head>
<body>

<header class="quiz-header">
  <div class="container">
    <a href="index.html" style="display:inline-flex;align-items:center;gap:8px;padding:7px 14px;background:var(--bg-3);border:2px solid var(--border);border-radius:var(--radius);font-size:13px;color:var(--text);text-decoration:none;transition:border-color 0.15s;" onmouseover="this.style.borderColor=getComputedStyle(document.documentElement).getPropertyValue('--yellow')" onmouseout="this.style.borderColor=getComputedStyle(document.documentElement).getPropertyValue('--border')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg> Accueil</a>
    <div class="logo">QCM<span>Annales</span></div>
    <div></div>
  </div>
</header>

<div class="container" style="padding-top:2.5rem; padding-bottom:3rem; max-width:800px;">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem;">
    <div>
      <h1 style="font-size:2rem; margin-bottom:0.25rem;">Historique</h1>
      <p style="color:var(--text-2); font-size:14px;">Clique sur une session pour voir la correction détaillée.</p>
    </div>
    <button class="btn-danger" onclick="effacerHistorique()">🗑 Effacer l'historique</button>
  </div>
  <div id="content"></div>
</div>

<!-- MODALE -->
<div class="modal-overlay" id="modal-overlay" onclick="fermerRevue(event)">
  <div class="modal" id="modal">
    <div class="modal-close" onclick="fermerRevue(null, true)">×</div>
    <div id="modal-content"></div>
  </div>
</div>

<script>
const history = JSON.parse(localStorage.getItem('qcm_history') || '[]');
const LETTERS = ['A','B','C','D','E','F','G','H'];

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long', year:'numeric' })
    + ' à ' + d.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' });
}

function scoreClass(sur20) {
  if (sur20 >= 12) return '';
  if (sur20 >= 8) return 'mid';
  return 'low';
}

function render() {
  const container = document.getElementById('content');
  if (!history.length) {
    container.innerHTML = `
      <div class="empty-state">
        <div style="font-size:3rem;margin-bottom:1rem;">📭</div>
        <div style="font-size:16px;font-weight:800;color:var(--text-2);margin-bottom:.5rem;">Aucun quiz effectué pour l'instant</div>
        <div style="font-size:14px;color:var(--text-3);">Lance une session depuis la page d'accueil pour voir ton historique ici.</div>
      </div>`;
    return;
  }

  const total = history.length;
  const moyenne = Math.round(history.reduce((acc, h) => acc + (h.sur20 || 0), 0) / total * 10) / 10;
  const meilleur = Math.max(...history.map(h => h.sur20 || 0));

  container.innerHTML = `
    <div class="stats-row">
      <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-lbl">Sessions</div></div>
      <div class="stat-card"><div class="stat-num">${moyenne}/20</div><div class="stat-lbl">Moyenne</div></div>
      <div class="stat-card"><div class="stat-num">${meilleur}/20</div><div class="stat-lbl">Meilleur score</div></div>
    </div>
    <div id="cards"></div>`;

  const cards = document.getElementById('cards');
  [...history].reverse().forEach((h, displayIndex) => {
    const realIndex = history.length - 1 - displayIndex;
    const sur20 = h.sur20 !== undefined ? h.sur20 : 0;
    const tags = h.tags && h.tags.length ? h.tags : ['Tous les chapitres'];
    const mode = h.mode === 'examen' ? 'examen' : 'entrainement';
    const modeLabel = mode === 'examen' ? 'Examen' : 'Entraînement';
    const hasDetails = h.details && h.details.length && h.details[0].options;

    const card = document.createElement('div');
    card.className = 'history-card';
    if (hasDetails) card.onclick = () => ouvrirRevue(realIndex);
    card.innerHTML = `
      <div class="score-circle ${scoreClass(sur20)}">${sur20}/20</div>
      <div class="card-main">
        <div class="card-date">${formatDate(h.date)}</div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:4px;">
          <span class="mode-badge mode-${mode}">${modeLabel}</span>
          <span style="font-size:12px;color:var(--text-3);">${h.total || h.details?.length || '?'} questions</span>
          ${hasDetails ? '<span style="font-size:11px;color:var(--text-3);margin-left:4px;">→ voir la correction</span>' : ''}
        </div>
        <div class="card-tags">${tags.map(t => `<span class="tag-pill">${t}</span>`).join('')}</div>
      </div>
      <div class="card-right">
        <div style="font-size:22px;font-weight:700;color:var(--text);">${sur20}<span style="font-size:14px;color:var(--text-3);">/20</span></div>
        <div class="total-pts">${h.scoreTotal?.toFixed ? h.scoreTotal.toFixed(2) : h.scoreTotal} / ${h.total} pts</div>
      </div>`;
    cards.appendChild(card);
  });
}

function ouvrirRevue(index) {
  const h = history[index];
  if (!h || !h.details) return;
  const modalContent = document.getElementById('modal-content');
  const sur20 = h.sur20 || 0;
  const mode = h.mode === 'examen' ? 'Examen' : 'Entraînement';

  // Badges chapitres
  const tagMap = {};
  h.details.forEach(d => { const t = d.tag || 'Sans chapitre'; tagMap[t] = (tagMap[t] || 0) + 1; });
  const tagEntries = Object.entries(tagMap);

  let html = `<div style="margin-bottom:2rem;">
    <div style="font-size:12px;color:var(--text-3);margin-bottom:.4rem;">${formatDate(h.date)} · ${mode}</div>
    <div style="font-size:1.75rem;font-weight:700;color:var(--text);margin-bottom:1.25rem;">Correction — <span style="color:var(--yellow);">${sur20}/20</span></div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;">
      ${tagEntries.map(([tag, count]) => `<div style="display:inline-flex;align-items:center;gap:7px;background:var(--bg-3);border:2px solid var(--border);border-radius:12px;padding:6px 12px;"><span style="font-size:12px;font-weight:800;color:var(--text);">${tag}</span><span style="font-size:11px;background:var(--yellow);color:var(--on-accent);border-radius:10px;padding:1px 6px;font-weight:800;">${count}q</span></div>`).join('')}
    </div>
  </div>`;

  h.details.forEach((d, i) => {
    const pts = d.pts !== undefined ? d.pts : 0;
    const ptsColor = pts === 1 ? 'var(--green-text)' : pts === 0 ? 'var(--red-text)' : 'var(--amber-text)';
    const ptsStr = pts === 1 ? '+1 pt' : pts === 0 ? '+0 pt' : pts === 0.5 ? '+0,5 pt' : pts === 0.2 ? '+0,2 pt' : '+' + pts + ' pt';
    const topBarColor = pts === 1 ? 'var(--green)' : pts === 0 ? 'var(--red)' : 'var(--gold)';

    let bhtml = '';
    // Header
    bhtml += '<div style="display:flex;justify-content:space-between;align-items:center;padding:0.75rem 1.25rem;background:var(--bg-2);border-bottom:1px solid var(--border);">';
    bhtml += '<div style="display:flex;align-items:center;gap:10px;">';
    bhtml += '<span style="background:var(--bg-3);color:var(--text-2);font-size:11px;font-weight:800;padding:4px 10px;border-radius:10px;letter-spacing:0.06em;text-transform:uppercase;border:2px solid var(--border);">Question ' + (i+1) + '</span>';
    if (d.tag) bhtml += '<span style="font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;">' + d.tag + '</span>';
    bhtml += '</div>';
    bhtml += '<span style="font-size:14px;font-weight:800;color:' + ptsColor + ';">' + ptsStr + '</span>';
    bhtml += '</div>';

    // Question text
    bhtml += '<div style="padding:1.25rem;font-size:15px;color:var(--text);font-weight:700;line-height:1.65;">' + d.question + '</div>';
    if (d.type === 'qzone') {
      bhtml += '<div style="padding:0 1.25rem 1rem;">' + qzoneStaticHTML(d, d.userAns) + '</div>';
    } else if (d.image) {
      bhtml += '<div style="padding:0 1.25rem 1rem;"><img src="' + d.image + '" style="max-width:100%;max-height:260px;border-radius:12px;border:2px solid var(--border);display:block;"></div>';
    }

    if (d.type === 'qroc') {
      const userAns = typeof d.userAns === 'string' ? d.userAns : '';
      bhtml += '<div style="display:flex;flex-direction:column;gap:6px;padding:0 1.25rem 1rem;">';
      bhtml += '<div style="font-size:13px;padding:8px 12px;border-radius:var(--radius);background:var(--bg-3);color:var(--text-2);">Ta réponse : <em>' + (userAns || '—') + '</em></div>';
      if (d.answer) bhtml += '<div style="font-size:13px;padding:8px 12px;border-radius:var(--radius);background:var(--green-bg);color:var(--green-text);border:2px solid var(--green);">✓ Attendu : ' + d.answer + '</div>';
      bhtml += '</div>';
    } else if (d.type === 'qassoc') {
      bhtml += '<div style="padding:0 1.25rem 1rem;">' + qassocCorrectionHTML(d, d.userAns, {banner:false, explanation:false}) + '</div>';
    } else {
      const userAns = Array.isArray(d.userAns) ? d.userAns : [];
      bhtml += '<div style="padding:0 1.25rem 1rem;">' + qcmCorrectionHTML(d, userAns, pts, '', {banner:false, explanation:false}) + '</div>';
    }

    if (d.explanation) {
      bhtml += '<div style="padding:0.75rem 1.25rem;border-top:1px solid var(--border);font-size:13px;color:var(--text-2);line-height:1.6;border-left:3px solid var(--yellow);background:var(--bg-2);">'+d.explanation+'</div>';
    }

    html += '<div style="border:2px solid var(--border);border-top:3px solid '+topBarColor+';border-radius:var(--radius-lg);overflow:hidden;margin-bottom:1.25rem;">'+bhtml+'</div>';
  });

  modalContent.innerHTML = html;
  document.getElementById('modal-overlay').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function fermerRevue(e, force) {
  if (force || (e && e.target === document.getElementById('modal-overlay'))) {
    document.getElementById('modal-overlay').classList.remove('show');
    document.body.style.overflow = '';
  }
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') fermerRevue(null, true); });

async function effacerHistorique() {
  if (!confirm("Effacer tout l'historique ? Cette action est irréversible.")) return;
  if (window.qcmSync && qcmSync.user()) await qcmSync.clearRemoteHistory();
  localStorage.removeItem('qcm_history');
  try { if (window.localforage) localforage.removeItem('qcm_history'); } catch (e) {}
  window.location.reload();
}

render();
window.addEventListener('qcm-synced', ev => { if (ev.detail.changed) location.reload(); });
</script>
</body>
</html>
