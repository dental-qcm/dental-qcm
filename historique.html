<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historique — Annales QCM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"></script>
<style>
.stat-card {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.25rem;
  text-align: center;
}
.stat-card .stat-num { font-family: var(--font-display); font-size: 2rem; color: var(--yellow); line-height: 1; }
.stat-card .stat-label { font-size: 11px; color: var(--text-3); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.06em; }

.session-card {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.25rem;
  margin-bottom: 1rem;
  transition: border-color 0.15s;
  cursor: pointer;
}
.session-card:hover { border-color: var(--border-2); }
.session-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem; }
.session-date { font-size: 12px; color: var(--text-3); }
.session-score { font-size: 1.5rem; font-family: var(--font-display); color: var(--yellow); }
.session-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.session-tag { font-size: 11px; color: var(--text-3); background: var(--bg-3); padding: 3px 8px; border-radius: 999px; }
.session-mode { font-size: 11px; padding: 3px 8px; border-radius: 999px; }
.session-mode.entrainement { background: var(--yellow-dim); color: var(--yellow-text); }
.session-mode.examen { background: var(--red-bg); color: var(--red-text); }
.session-detail { display: none; margin-top: 1rem; border-top: 1px solid var(--border); padding-top: 1rem; }
.session-detail.open { display: block; }
.detail-row { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--border); color: var(--text-2); }
.detail-row:last-child { border-bottom: none; }

/* TABS */
.hist-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 2rem; }
.hist-tab {
  padding: 10px 20px; font-size: 14px; color: var(--text-2);
  background: none; border: none; border-bottom: 2px solid transparent;
  cursor: pointer; font-family: var(--font-body);
  margin-bottom: -1px; transition: all 0.15s;
}
.hist-tab:hover { color: var(--text); }
.hist-tab.active { color: var(--yellow); border-bottom-color: var(--yellow); }

/* GRAPH */
.graph-card {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.5rem;
  margin-bottom: 1.5rem;
}
.graph-card h3 { font-size: 14px; font-weight: 500; color: var(--text); margin-bottom: 1.5rem; }
.bar-chart { display: flex; align-items: flex-end; gap: 8px; height: 120px; margin-bottom: 0.5rem; }
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
.bar-fill {
  width: 100%; border-radius: 4px 4px 0 0;
  background: var(--yellow);
  min-height: 2px;
  transition: height 0.3s ease;
  position: relative;
}
.bar-fill:hover { opacity: 0.8; }
.bar-fill.today { background: var(--yellow); box-shadow: 0 0 10px rgba(232,255,0,0.3); }
.bar-fill.empty { background: var(--bg-3); }
.bar-val { font-size: 11px; color: var(--text-3); font-weight: 500; }
.bar-day { font-size: 10px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 4px; }
.bar-day.today-label { color: var(--yellow); font-weight: 500; }

.score-chart { display: flex; align-items: flex-end; gap: 8px; height: 120px; margin-bottom: 0.5rem; }

.graph-tabs { display: flex; gap: 8px; margin-bottom: 1.5rem; }
.graph-tab {
  font-size: 12px; padding: 5px 12px; border-radius: 999px;
  border: 1px solid var(--border); background: none;
  color: var(--text-3); cursor: pointer; font-family: var(--font-body);
  transition: all 0.15s;
}
.graph-tab.active { background: var(--yellow); color: #0d0d0d; border-color: var(--yellow); font-weight: 500; }
</style>
<script>
(function() {
  const s = JSON.parse(localStorage.getItem('qcm_settings') || '{}');
  if (!s.accentColor && !s.theme) return;
  const r = document.documentElement;
  const c = s.accentColor || '#e8ff00';
  const t = s.theme || 'dark';
  function hexToRgba(hex, a) {
    const rv = parseInt(hex.slice(1,3),16), gv = parseInt(hex.slice(3,5),16), bv = parseInt(hex.slice(5,7),16);
    return 'rgba('+rv+','+gv+','+bv+','+a+')';
  }
  r.style.setProperty('--yellow', c);
  r.style.setProperty('--yellow-dim', hexToRgba(c, 0.08));
  r.style.setProperty('--yellow-text', c);
  r.style.setProperty('--accent-color', c);
  if (t === 'light') {
    r.style.setProperty('--bg','#f8f8f5'); r.style.setProperty('--bg-2','#ffffff');
    r.style.setProperty('--bg-3','#f0f0eb'); r.style.setProperty('--border','#e0e0db');
    r.style.setProperty('--border-2','#c8c8c0'); r.style.setProperty('--text','#1a1a18');
    r.style.setProperty('--text-2','#5a5a52'); r.style.setProperty('--text-3','#9a9a90');
  } else {
    r.style.setProperty('--bg','#0d0d0d'); r.style.setProperty('--bg-2','#161616');
    r.style.setProperty('--bg-3','#1e1e1e'); r.style.setProperty('--border','#2a2a2a');
    r.style.setProperty('--border-2','#3a3a3a'); r.style.setProperty('--text','#f0f0ee');
    r.style.setProperty('--text-2','#a0a09a'); r.style.setProperty('--text-3','#606060');
  }
})();
</script>
</head>
<body>

<header class="quiz-header">
  <div class="container">
    <a href="index.html" class="back-link">← Accueil</a>
    <div class="logo">QCM<span>Annales</span></div>
    <div style="display:flex;gap:10px;align-items:center;"><a href="reglages.html" class="btn-nav" style="text-decoration:none;font-size:13px;">⚙</a><button class="btn-ghost danger" onclick="clearHistory()">Tout effacer</button></div>
  </div>
</header>

<div class="container" style="padding-top:2.5rem; padding-bottom:3rem;">
  <div style="margin-bottom:2rem;">
    <h1 style="font-size:2rem; margin-bottom:0.5rem;">Historique</h1>
    <p style="color:var(--text-2); font-size:14px;">Tes sessions et ta progression.</p>
  </div>

  <!-- STATS GLOBALES -->
  <div id="global-stats" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap:1rem; margin-bottom:2.5rem;"></div>

  <!-- TABS -->
  <div class="hist-tabs">
    <button class="hist-tab active" id="tab-sessions-btn" onclick="switchTab('sessions')">Sessions</button>
    <button class="hist-tab" id="tab-graph-btn" onclick="switchTab('graph')">Graphiques</button>
  </div>

  <!-- TAB SESSIONS -->
  <div id="tab-sessions">
    <div id="history-list"></div>
    <div class="empty" id="empty-state" style="display:none;">
      <p>Aucune session pour l'instant.</p>
      <a href="quiz.html" class="btn-primary" style="text-decoration:none; display:inline-block; margin-top:1rem;">Faire un quiz</a>
    </div>
  </div>

  <!-- TAB GRAPHIQUES -->
  <div id="tab-graph" style="display:none;">

    <div class="graph-card">
      <h3>Questions faites</h3>
      <div class="graph-tabs">
        <button class="graph-tab active" id="gtab-week" onclick="setGraphPeriod('week')">7 jours</button>
        <button class="graph-tab" id="gtab-month" onclick="setGraphPeriod('month')">30 jours</button>
      </div>
      <div class="bar-chart" id="bar-chart-questions"></div>
      <div style="display:flex; justify-content:space-between;" id="bar-days-questions"></div>
    </div>

    <div class="graph-card">
      <h3>Score moyen / 20</h3>
      <div class="bar-chart" id="bar-chart-scores"></div>
      <div style="display:flex; justify-content:space-between;" id="bar-days-scores"></div>
    </div>

  </div>
</div>

<script>
let qcmHistory = [];
let graphPeriod = 'week';

async function clearHistory() {
  if (!confirm('Effacer tout l\'historique ?')) return;
  qcmHistory = [];
  await localforage.setItem('qcm_history', qcmHistory);
  render();
}

function switchTab(name) {
  ['sessions','graph'].forEach(t => {
    document.getElementById('tab-' + t).style.display = t === name ? 'block' : 'none';
    document.getElementById('tab-' + t + '-btn').classList.toggle('active', t === name);
  });
  if (name === 'graph') renderGraphs();
}

function setGraphPeriod(period) {
  graphPeriod = period;
  ['week','month'].forEach(t => document.getElementById('gtab-' + t).classList.toggle('active', t === period));
  renderGraphs();
}

function render() {
  renderStats();
  renderSessions();
}

function renderStats() {
  const statsDiv = document.getElementById('global-stats');
  if (!qcmHistory.length) { statsDiv.innerHTML = ''; return; }
  const totalSessions = qcmHistory.length;
  const totalQuestions = qcmHistory.reduce((s, h) => s + h.total, 0);
  const avgSur20 = (qcmHistory.reduce((s, h) => s + h.sur20, 0) / totalSessions).toFixed(1);
  const bestSur20 = Math.max(...qcmHistory.map(h => h.sur20)).toFixed(1);

  // Streak
  const today = new Date(); today.setHours(0,0,0,0);
  const days = [...new Set(qcmHistory.map(s => { const d = new Date(s.date); d.setHours(0,0,0,0); return d.getTime(); }))].sort((a,b) => b-a);
  let streak = 0, check = today.getTime();
  if (!days.includes(check)) check -= 86400000;
  for (const day of days) {
    if (day === check) { streak++; check -= 86400000; } else if (day < check) break;
  }

  statsDiv.innerHTML = `
    <div class="stat-card"><div class="stat-num">${totalSessions}</div><div class="stat-label">Sessions</div></div>
    <div class="stat-card"><div class="stat-num">${totalQuestions}</div><div class="stat-label">Questions</div></div>
    <div class="stat-card"><div class="stat-num">${avgSur20.replace('.',',')}</div><div class="stat-label">Moyenne /20</div></div>
    <div class="stat-card"><div class="stat-num">${bestSur20.replace('.',',')}</div><div class="stat-label">Meilleur</div></div>
    <div class="stat-card"><div class="stat-num" style="font-size:1.8rem;">${streak > 0 ? '🔥' : '💤'} ${streak}</div><div class="stat-label">Streak</div></div>
  `;
}

function renderSessions() {
  const list = document.getElementById('history-list');
  const empty = document.getElementById('empty-state');
  if (!qcmHistory.length) { empty.style.display = 'block'; list.innerHTML = ''; return; }
  empty.style.display = 'none';
  list.innerHTML = '';
  [...qcmHistory].reverse().forEach((session, ri) => {
    const i = qcmHistory.length - 1 - ri;
    const date = new Date(session.date);
    const dateStr = date.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }) + ' à ' + date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    const modeClass = session.mode === 'examen' ? 'examen' : 'entrainement';
    const modeLabel = session.mode === 'examen' ? 'Examen' : 'Entraînement';
    const tags = session.tags && session.tags.length ? session.tags : ['Tous les chapitres'];
    const sur20 = parseFloat(session.sur20);
    const sur20Str = Number.isInteger(sur20) ? sur20 : sur20.toString().replace('.', ',');
    const card = document.createElement('div');
    card.className = 'session-card';
    card.innerHTML = `
      <div class="session-header">
        <div>
          <div class="session-date">${dateStr}</div>
          <div class="session-tags">
            <span class="session-mode ${modeClass}">${modeLabel}</span>
            ${tags.map(t => `<span class="session-tag">${t}</span>`).join('')}
          </div>
        </div>
        <div style="text-align:right;">
          <div class="session-score">${sur20Str} / 20</div>
          <div style="font-size:12px; color:var(--text-3);">${session.total} questions</div>
        </div>
      </div>
      <div class="session-detail" id="detail-${i}">
        ${session.details ? session.details.map(d => `
          <div class="detail-row">
            <span>${d.question.substring(0,70)}${d.question.length>70?'…':''}</span>
            <strong style="color:${d.pts===1?'var(--yellow)':d.pts===0?'var(--red-text)':'var(--amber-text)'}; white-space:nowrap; margin-left:1rem;">${d.pts===1?'+1':d.pts===0.5?'+0,5':d.pts===0.2?'+0,2':'+0'} pt</strong>
          </div>
        `).join('') : '<div style="color:var(--text-3); font-size:13px;">Détail non disponible</div>'}
      </div>
    `;
    card.onclick = () => document.getElementById('detail-' + i).classList.toggle('open');
    list.appendChild(card);
  });
}

function renderGraphs() {
  const days = graphPeriod === 'week' ? 7 : 30;
  const today = new Date(); today.setHours(0,0,0,0);

  // Build day buckets
  const buckets = [];
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(today.getTime() - i * 86400000);
    buckets.push({ date: d, questions: 0, scores: [], label: '' });
  }

  // Fill buckets
  qcmHistory.forEach(s => {
    const d = new Date(s.date); d.setHours(0,0,0,0);
    const bucket = buckets.find(b => b.date.getTime() === d.getTime());
    if (bucket) {
      bucket.questions += s.total;
      bucket.scores.push(s.sur20);
    }
  });

  // Labels
  const dayNames = ['D','L','M','M','J','V','S'];
  buckets.forEach((b, i) => {
    const isToday = b.date.getTime() === today.getTime();
    if (graphPeriod === 'week') {
      b.label = isToday ? 'Auj.' : dayNames[b.date.getDay()];
      b.isToday = isToday;
    } else {
      b.label = b.date.getDate() === 1 || i === 0 ? b.date.toLocaleDateString('fr-FR', {day:'numeric',month:'short'}) : (b.date.getDate() % 5 === 0 ? b.date.getDate().toString() : '');
      b.isToday = isToday;
    }
  });

  renderBarChart('bar-chart-questions', 'bar-days-questions', buckets, 'questions');
  renderBarChart('bar-chart-scores', 'bar-days-scores', buckets, 'scores');
}

function renderBarChart(chartId, daysId, buckets, type) {
  const chart = document.getElementById(chartId);
  const daysEl = document.getElementById(daysId);
  chart.innerHTML = ''; daysEl.innerHTML = '';

  const values = buckets.map(b => type === 'questions' ? b.questions : (b.scores.length ? b.scores.reduce((a,c) => a+c,0)/b.scores.length : null));
  const max = Math.max(...values.filter(v => v !== null), 1);

  buckets.forEach((b, i) => {
    const val = values[i];
    const pct = val !== null ? Math.max((val / max) * 100, val > 0 ? 4 : 0) : 0;
    const col = document.createElement('div');
    col.className = 'bar-col';

    const valStr = val === null ? '' : type === 'scores' ? parseFloat(val.toFixed(1)).toString().replace('.',',') : val;
    const barClass = val === null || val === 0 ? 'empty' : b.isToday ? 'today' : '';

    col.innerHTML = `
      <div class="bar-val">${val !== null && val > 0 ? valStr : ''}</div>
      <div class="bar-fill ${barClass}" style="height:${pct}%; width:100%;"></div>
    `;
    chart.appendChild(col);

    const dayEl = document.createElement('div');
    dayEl.style.cssText = 'flex:1; text-align:center;';
    dayEl.innerHTML = `<span class="bar-day ${b.isToday ? 'today-label' : ''}">${b.label}</span>`;
    daysEl.appendChild(dayEl);
  });
}

async function init() {
  const old = localStorage.getItem('qcm_history');
  if (old) {
    const parsed = JSON.parse(old);
    if (parsed.length > 0) await localforage.setItem('qcm_history', parsed);
    localStorage.removeItem('qcm_history');
  }
  qcmHistory = (await localforage.getItem('qcm_history')) || [];
  render();
}

init();
</script>
</body>
</html>
