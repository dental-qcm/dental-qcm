<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accès restreint — Annales QCM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    (function() {
      const s = JSON.parse(localStorage.getItem('qcm_settings') || '{}');
      if (!s.accentColor && !s.theme) return;
      const r = document.documentElement;
      const c = s.accentColor || '#00c853';
      const t = s.theme || 'dark';
      r.style.setProperty('--yellow', c);
      r.style.setProperty('--accent-color', c);
      if (t === 'light') {
        r.style.setProperty('--bg','#f8f8f5'); r.style.setProperty('--bg-2','#ffffff');
        r.style.setProperty('--border','#e0e0db'); r.style.setProperty('--text','#1a1a18');
        r.style.setProperty('--text-2','#5a5a52');
      } else {
        r.style.setProperty('--bg','#0d0d0d'); r.style.setProperty('--bg-2','#161616');
        r.style.setProperty('--border','#2a2a2a'); r.style.setProperty('--text','#f0f0ee');
        r.style.setProperty('--text-2','#a0a09a');
      }
    })();
  </script>
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh;">
  <div style="background:var(--bg-2); border:1px solid var(--border); border-radius:14px; padding:2.5rem; max-width:400px; width:100%; text-align:center;">
    <div style="font-size:3rem; margin-bottom:1rem;">🔒</div>
    <h2 style="font-size:1.5rem; margin-bottom:0.5rem; color:var(--text);">Accès restreint</h2>
    <p style="font-size:14px; color:var(--text-2); margin-bottom:1.5rem;">Saisis le code PIN pour gérer les questions.</p>
    <input type="password" id="pin-input" placeholder="Code PIN..." style="width:100%; padding:12px; border:1px solid var(--border); border-radius:6px; font-size:1.2rem; text-align:center; background:var(--bg); color:var(--text); margin-bottom:1.5rem; letter-spacing:0.2em; box-sizing:border-box;">
    <button onclick="verifierPin()" style="width:100%; padding:12px; background:var(--yellow); color:#000; border:none; border-radius:6px; font-size:15px; font-weight:600; cursor:pointer; font-family:var(--font-body);">Déverrouiller →</button>
    <div style="margin-top:1.5rem;">
      <a href="index.html" style="color:var(--text-3); font-size:13px; text-decoration:none;">← Retour à l'accueil</a>
    </div>
  </div>
  <script>
    document.getElementById('pin-input').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') verifierPin();
    });
    const SUPABASE_URL = 'https://rcrkksvkkoujrmpnpvov.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_cfjmRq5I4YvrEZB0hbSK-w_-GQ_WWzz';

    async function verifierPin() {
      const pin = document.getElementById('pin-input').value;
      if (!pin) return;

      const btn = document.querySelector('button');
      btn.textContent = 'Vérification...';
      btn.disabled = true;

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/verify_admin_pin`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': 'Bearer ' + SUPABASE_KEY,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ p_pin: pin })
        });
        const valid = await res.json();
        if (valid === true) {
          sessionStorage.setItem('auth_pin', pin);
          window.location.href = 'ajouter.html';
        } else {
          alert('Code PIN incorrect ❌');
          document.getElementById('pin-input').value = '';
          btn.textContent = 'Déverrouiller →';
          btn.disabled = false;
        }
      } catch(e) {
        alert('Erreur de connexion, réessaie.');
        btn.textContent = 'Déverrouiller →';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
